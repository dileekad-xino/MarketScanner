<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>MarketScanner Chart</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #0b0b0b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #e0e0e0;
        user-select: none;
      }

      #chart-container {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0b0b;
      }

      #chart-root {
        width: 100%;
        height: 100%;
      }

      #chart-symbol {
        position: absolute;
        top: 14px;
        left: 18px;
        font-size: 14px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        background: rgba(8, 8, 8, 0.6);
        padding: 4px 8px;
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.08);
      }

      #chart-symbol span {
        font-weight: 600;
        color: #8ab4ff;
      }
    </style>
    <script src="https://unpkg.com/lightweight-charts@5.0.9/dist/lightweight-charts.standalone.production.js"></script>
  </head>
  <body>
    <div id="chart-container">
      <div id="chart-root"></div>
      <div id="chart-symbol">Symbol: <span>-</span></div>
    </div>

    <script>
      (function () {
        const container = document.getElementById("chart-root");
        const symbolText = document.querySelector("#chart-symbol span");
        const chart = LightweightCharts.createChart(container, {
          layout: {
            background: { type: "solid", color: "#0b0b0b" },
            textColor: "#d7d7d7",
          },
          grid: {
            vertLines: { color: "rgba(255,255,255,0.04)" },
            horzLines: { color: "rgba(255,255,255,0.04)" },
          },
          crosshair: {
            mode: LightweightCharts.CrosshairMode.Magnet,
          },
          rightPriceScale: { borderVisible: false },
          timeScale: { borderVisible: false },
          autoSize: true,
        });

        const candleSeries = chart.addCandlestickSeries({
          upColor: "#00c853",
          downColor: "#ff5252",
          borderUpColor: "#00c853",
          borderDownColor: "#ff5252",
          wickUpColor: "#00c853",
          wickDownColor: "#ff5252",
        });

        let maSeries = null;

        function ensureLineSeries() {
          if (!maSeries) {
            maSeries = chart.addLineSeries({
              color: "#ffcc80",
              lineWidth: 2,
            });
          }
          return maSeries;
        }

        function resizeChart() {
          if (!container || !container.parentElement) {
            return;
          }
          const { clientWidth, clientHeight } = container.parentElement;
          chart.applyOptions({ width: clientWidth, height: clientHeight });
        }

        resizeChart();
        window.addEventListener("resize", resizeChart);

        window.marketScannerChart = {
          setData: function (payload) {
            if (!payload || !payload.candles) {
              return;
            }

            candleSeries.setData(payload.candles);
            symbolText.textContent = payload.symbol || "-";

            if (payload.movingAverage && payload.movingAverage.length > 0) {
              ensureLineSeries().setData(payload.movingAverage);
            } else if (maSeries) {
              chart.removeSeries(maSeries);
              maSeries = null;
            }

            chart.timeScale().fitContent();
          },
        };
      })();
    </script>
  </body>
</html>
